<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Profile · Tomorrow School</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="loginPage" class="page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-brand">
                    <div class="brand-mark"></div>
                    <span>Tomorrow School</span>
                </div>
                <h2>Sign in to your profile</h2>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username or email</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="login-btn">Sign in</button>
                </form>

                <div id="errorMessage" class="error-message" style="display:none"></div>
            </div>
        </div>
    </div>

    <div id="profilePage" class="page" style="display:none">
        <header class="profile-header">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-mark"></div>
                    <span>Tomorrow School</span>
                </div>
                <div class="header-user">
                    <span class="header-login">@<span id="headerLogin">-</span></span>
                    <span class="header-pill">Level <strong id="headerLevel">0</strong></span>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </div>
        </header>

        <main class="profile-main">
            <section class="card identity-card">
                <div class="avatar" id="avatar">·</div>
                <div class="identity-text">
                    <div class="identity-name" id="userFullName">-</div>
                    <div class="identity-meta">
                        <span class="meta-pill">@<span id="userLogin">-</span></span>
                        <span class="meta-pill">ID <span id="userId">-</span></span>
                        <span class="meta-pill" id="userCampus">-</span>
                    </div>
                    <div class="identity-meta-secondary">
                        <span id="userEmail">-</span>
                    </div>
                </div>
            </section>

            <section class="program-selector card">
                <div class="program-selector-head">
                    <span class="program-selector-label">Program</span>
                    <span class="program-selector-hint" id="programHint">Showing all activity</span>
                </div>
                <div class="program-tabs" id="programTabs" role="tablist">
                    <button class="program-tab is-active" data-program="all" role="tab" aria-selected="true">All</button>
                    <button class="program-tab" data-program="core-education" role="tab">Core Education</button>
                    <button class="program-tab" data-program="piscine-js" role="tab">Piscine JS</button>
                    <button class="program-tab" data-program="piscine-go" role="tab">Piscine Go</button>
                    <button class="program-tab" data-program="piscine-ai" role="tab">Piscine AI</button>
                    <button class="program-tab" data-program="piscine-rust" role="tab">Piscine Rust</button>
                </div>
            </section>

            <section class="stats-row">
                <div class="card stat-card stat-card-level">
                    <div class="stat-label">Current Level</div>
                    <div id="levelCircle" class="level-circle"></div>
                    <div id="levelEventLabel" class="stat-sub">—</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-label">Total XP</div>
                    <div class="stat-value" id="totalXp">0</div>
                    <div class="stat-sub">
                        <span id="passedProjects">0</span> / <span id="totalProjects">0</span> projects passed
                    </div>
                </div>
                <div class="card stat-card">
                    <div class="stat-label">Audit Ratio</div>
                    <div class="stat-value" id="auditRatio">0.0</div>
                    <div id="auditRatioStatus" class="stat-sub">—</div>
                </div>
            </section>

            <section class="card audit-card">
                <h3>Audits</h3>
                <div id="auditBars" class="graph"></div>
            </section>

            <section class="card constellation-card">
                <h3>Project Constellation</h3>
                <div id="constellation" class="graph constellation"></div>
            </section>

            <section class="charts-row">
                <div class="card">
                    <h3>XP Earned Over Time</h3>
                    <div id="xpOverTimeGraph" class="graph"></div>
                </div>
                <div class="card">
                    <h3>Pass / Fail</h3>
                    <div id="successRateGraph" class="graph"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/graphql-client.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/graphs.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
